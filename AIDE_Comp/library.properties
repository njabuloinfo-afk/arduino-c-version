sentence=Arduino library for BMT WHA103 ESP32-C3 board with SSD1306 OLED and ES8311 audio codec
paragraph=This library provides Arduino-compatible drivers for the BMT WHA103 board featuring an ESP32-C3 MCU, 0.96" SSD1306 OLED display, ES8311 audio codec, and a user button. It includes display management, button handling, I2C device scanning, and I2S audio configuration.
