; PlatformIO Project Configuration for BMT WHA103 Arduino Library
; 
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bmt-wha103]
platform = espressif32
board = esp32c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Library dependencies
lib_deps = 
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit SSD1306@^2.5.7

; Build flags
build_flags = 
    -D BMT_WHA103_ARDUINO
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Upload settings
upload_speed = 921600

; Partition scheme (4MB flash, no OTA)
board_build.partitions = default_4MB.csv

; Custom board configuration (optional)
; board_build.mcu = esp32c3
; board_build.f_cpu = 160000000L
; board_build.flash_size = 4MB

[env:bmt-wha103-basic]
extends = env:bmt-wha103
board_build.filesystem = littlefs

[env:bmt-wha103-audio]
extends = env:bmt-wha103
build_flags = 
    -D BMT_WHA103_ARDUINO
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D I2S_BCLK_PIN=6
    -D I2S_WS_PIN=8
    -D I2S_DIN_PIN=7
    -D I2S_DOUT_PIN=10
    -D I2S_MCLK_PIN=5

; Example build targets
[platformio]
default_envs = bmt-wha103